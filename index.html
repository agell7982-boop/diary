<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>나만의 일기장</title><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.json"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet"><style>

</style></head><body><div id="app"></div><div id="sheet"></div><div id="toast" role="status"></div><script>
/* data.js: 항목 저장 구조 */
const KEY='diary.v1',A={};
let S={items:[],fmt12:false,goals:[],goalsM:{},moods:{},reps:[],skip:{},rdone:{},diary:{},cfg:{lock:true,alarmSound:'chime',alarmVol:80,bgKeepAlive:true}},DR={title:'',time:null,alarm:null};
function load(){try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('저장 공간이 부족해요')}syKick();syncScheduledNotifications();updateBgKeepAlive()}
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function itemsOn(d){return S.items.filter(i=>i.date===d).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'))}
function addItem(o){S.items.push(Object.assign({id:uid(),kind:'event',time:null,alarm:null,done:false,detail:''},o));save()}
function updItem(id,p){const i=S.items.find(x=>x.id===id);if(i){Object.assign(i,p);save()}}
function delItem(id){const i=S.items.find(x=>x.id===id);if(i&&i.rid)S.skip[i.date+'|'+i.rid]=1;S.items=S.items.filter(x=>x.id!==id);save()}

/* time.js: 시간 해석·표기, 알람 선택지 */
function parseTime(s){s=s.toLowerCase().replace(/\s+/g,'');const pm=/오후|pm|p\.m/.test(s),am=/오전|am|a\.m/.test(s);s=s.replace(/오전|오후|a\.m\.?|p\.m\.?|am|pm/g,'');let h,n=0,m;
if(m=s.match(/^(\d{1,2})시반$/)){h=+m[1];n=30}else if(m=s.match(/^(\d{1,2})(?:[:시.](\d{1,2})?)?분?$/)){h=+m[1];n=+(m[2]||0)}else if(m=s.match(/^(\d{1,2})(\d{2})$/)){h=+m[1];n=+m[2]}else return null;
if(pm&&h<12)h+=12;if(am&&h===12)h=0;return h>23||n>59?null:pad(h)+':'+pad(n)}
function fmtTime(t){if(!t)return '종일';if(!S.fmt12)return t;const h=+t.slice(0,2);return (h<12?'오전 ':'오후 ')+(h%12||12)+':'+t.slice(3)}
const ALARMS=[[null,'알람 없음'],[0,'정시'],[10,'10분 전'],[30,'30분 전']];

/* holidays.js: 한국 공휴일 */
const HX={'2026-06-03':'지방선거'};
const HC={},DAY=864e5;
const iso=t=>t.toISOString().slice(0,10);
const utc=(y,m,d)=>new Date(Date.UTC(y,m,d));
function lunar(t){const o={};new Intl.DateTimeFormat('en-u-ca-chinese',{timeZone:'UTC',month:'numeric',day:'numeric'}).formatToParts(new Date(t.getTime()+12*36e5)).forEach(x=>o[x.type]=x.value);return {m:parseInt(o.month),leap:/\D/.test(o.month),d:+o.day}}
function holidaysOf(y){if(HC[y])return HC[y];const M={},dup={},cand=[];
const add=(t,n)=>{const k=iso(t);if(M[k])dup[k]=1;M[k]=n};
[[0,1,'신정'],[2,1,'삼일절',1],[4,5,'어린이날',1],[5,6,'현충일'],[7,15,'광복절',1],[9,3,'개천절',1],[9,9,'한글날',1],[11,25,'성탄절',1]].concat(y>=2026?[[6,17,'제헌절',1]]:[],y>=2027?[[4,1,'노동절',1]]:[]).forEach(([m,d,n,s])=>{const t=utc(y,m,d);add(t,n);if(s)cand.push({e:t,n,s:1})});
for(let t=utc(y,0,1);t.getUTCFullYear()===y;t=new Date(t.getTime()+DAY)){const l=lunar(t);if(l.leap)continue;
if(l.m===4&&l.d===8){add(t,'부처님오신날');cand.push({e:t,n:'부처님오신날',s:1})}
else if((l.m===1&&l.d===1)||(l.m===8&&l.d===15)){const n=l.m===1?'설날':'추석',b=[-1,0,1].map(i=>new Date(t.getTime()+i*DAY));b.forEach((x,i)=>add(x,i===1?n:n+' 연휴'));cand.push({e:b[2],n,b})}}
Object.keys(HX).forEach(k=>{if(+k.slice(0,4)===y)M[k]=HX[k]});
const wk=t=>t.getUTCDay()%6===0,nx=t=>{t=new Date(t.getTime()+DAY);while(wk(t)||M[iso(t)])t=new Date(t.getTime()+DAY);return t},done={};
cand.sort((a,b)=>a.e-b.e).forEach(c=>{const k=iso(c.e);if(done[k])return;const hit=c.b?c.b.some(x=>x.getUTCDay()===0||dup[iso(x)]):(wk(c.e)||dup[k]);if(hit){done[k]=1;M[iso(nx(c.e))]='대체공휴일('+c.n+')'}});
return HC[y]=M}
function holiday(k){return holidaysOf(+k.slice(0,4))[k]||null}
function isRed(k){return new Date(k+'T12:00:00').getDay()===0||!!holiday(k)}
function isSat(k){return new Date(k+'T12:00:00').getDay()===6}

/* week.js: 1주일 달력 */
const WD='일월화수목금토';let sel=ymd(new Date()),wk=0;
const dkey=k=>new Date(k+'T12:00:00');
function shift(k,n){const d=dkey(k);d.setDate(d.getDate()+n);return ymd(d)}
function weekDays(){const t=new Date();t.setHours(12,0,0,0);t.setDate(t.getDate()-t.getDay()+7*wk);return [0,1,2,3,4,5,6].map(i=>{const d=new Date(t);d.setDate(t.getDate()+i);return ymd(d)})}
const star=c=>`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" style="stroke:${c}" stroke-width="2" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>`;
function dotsFor(k){const it=itemsOn(k);if(!it.length)return '';if(it.length>=5)return star(it.every(i=>i.done)?'var(--ok)':'var(--no)');return it.slice(0,4).map(i=>`<i class="${i.done?'y':'n'}"></i>`).join('')}
function headHTML(){const d=dkey(sel),home=sel===ymd(new Date())&&wk===0,hn=holiday(sel);return `<div class="hd"><div><p class="mu${isRed(sel)?' hl':isSat(sel)?' bl':''}" style="margin:0">${WD[d.getDay()]}요일${hn?' · '+hn:''}${wxT(sel)}</p><h1>${d.getMonth()+1}월 ${d.getDate()}일</h1></div><div>${home?'':'<button class="tx" data-a="today">오늘</button>'}<button class="nv" data-a="wk" data-n="-1" aria-label="지난주">‹</button><button class="nv" data-a="wk" data-n="1" aria-label="다음주">›</button></div></div>`}
function weekHTML(){const td=ymd(new Date());return `<div class="wk">${weekDays().map((k,i)=>`<button class="d${k===sel?' a':''}${k===td?' t':''}${isRed(k)?' h':!isRed(k)&&isSat(k)?' b':''}" data-a="pick" data-d="${k}" aria-label="${k}"><span class="mu${i===0?' hl':i===6?' bl':''}">${'일월화수목금토'[i]}</span><b>${+k.slice(8)}</b><span class="dt">${dotsFor(k)}</span></button>`).join('')}</div>`}
A.pick=d=>{sel=d.d;render()};
A.wk=d=>{wk+=+d.n;sel=shift(sel,7*+d.n);render()};
A.today=()=>{sel=ymd(new Date());wk=0;render()};

/* list.js: 선택한 날짜의 시간순 목록 */
function listHTML(){return itemsListHTML()+repListHTML()}
function itemsListHTML(){const it=itemsOn(sel);if(!it.length)return '<p class="mu" style="margin-top:24px">'+(tab==='일정'?'이 날은 비어 있어요. 아래에 적어 보세요.':'이 날은 비어 있어요.')+'</p>';
return it.map(i=>`<div class="r"><button class="ck${i.done?' dn':''}" role="checkbox" aria-checked="${i.done}" aria-label="완료 표시" data-a="done" data-id="${i.id}"></button><button class="rb" data-a="open" data-id="${i.id}"><span class="mu tm">${fmtTime(i.time)}</span><span class="ti${i.done?' dd':''}">${esc(i.title)}</span><span class="mu">${i.detail?'메모 ':''}${i.alarm!==null?'⏰ ':''}</span></button><button class="rd" data-a="rm" data-id="${i.id}" aria-label="삭제">삭제</button></div>`).join('')}
A.done=d=>{const i=S.items.find(x=>x.id===d.id);updItem(d.id,{done:!i.done});render()};
A.open=d=>openSheet(d.id);
function removeWithUndo(id){const i=S.items.find(x=>x.id===id);if(!i)return;const k=S.items.indexOf(i);delItem(id);render();toast('삭제했어요','되돌리기',()=>{S.items.splice(Math.min(k,S.items.length),0,i);save();render()})}
A.rm=d=>removeWithUndo(d.id);

/* input.js: 하단 입력줄 */
function barHTML(){return `<div class="ib"><input id="ti" placeholder="일정을 적어요" value="${esc(DR.title)}" aria-label="일정 입력" enterkeyhint="done"><button class="cb" data-a="dt">${DR.time?fmtTime(DR.time):'시간'}</button><button class="cb" data-a="rp">반복</button><button class="ad" data-a="new" aria-label="자세히 쓰기로 추가">+</button></div>`}
A.dt=()=>openSheet(null,'time');A.new=()=>openSheet(null,'new');
A.add=()=>{const t=DR.title.trim();if(!t){const e=document.getElementById('ti');if(e)e.focus();return}addItem({date:sel,title:t,time:DR.time,alarm:DR.alarm});DR={title:'',time:null,alarm:null};render()};
document.addEventListener('input',e=>{if(e.target.id==='ti')DR.title=e.target.value});
document.addEventListener('keydown',e=>{if(e.target.id==='ti'&&e.key==='Enter')A.add()});

/* sheet.js: 시간·알람 설정 시트 */
let T=null;const SH=document.getElementById('sheet'),$=id=>document.getElementById(id);
function openSheet(id,mode){const i=id&&S.items.find(x=>x.id===id);T={id:id||null,full:!!(i||mode==='new'),title:i?i.title:(mode==='new'?DR.title:''),detail:i?(i.detail||''):'',time:i?i.time:DR.time,alarm:i?i.alarm:DR.alarm,msg:''};drawSheet()}
function closeSheet(){const back=DY&&(T||R);T=null;R=null;SH.innerHTML='';if(back)drawDay();else{DY=false;GS=false;GE=null}}
function selHTML(){const t=T.time,h=t?+t.slice(0,2):'',m=t?+t.slice(3):0;
const mo=[...Array(12).keys()].map(k=>k*5);if(t&&!mo.includes(m)){mo.push(m);mo.sort((a,b)=>a-b)}
const mm=`<select id="q-m" class="in" aria-label="분">${mo.map(x=>`<option value="${x}"${x===m?' selected':''}>${pad(x)}분</option>`).join('')}</select>`;
if(S.fmt12){const pm=h!==''&&h>=12;return `<select id="q-a" class="in" aria-label="오전 오후"><option value="0"${pm?'':' selected'}>오전</option><option value="1"${pm?' selected':''}>오후</option></select><select id="q-h" class="in" aria-label="시"><option value="">시</option>${[...Array(12).keys()].map(k=>{const v=k+1;return `<option value="${v}"${h!==''&&(h%12||12)===v?' selected':''}>${v}시</option>`}).join('')}</select>${mm}`}
return `<select id="q-h" class="in" aria-label="시"><option value="">시</option>${[...Array(24).keys()].map(k=>`<option value="${k}"${h===k?' selected':''}>${k}시</option>`).join('')}</select>${mm}`}
function drawSheet(){SH.innerHTML=`<div class="ov" data-a="ovx"><div class="sh" role="dialog" aria-modal="true" aria-label="시간과 알람">`
+(T.full?`${S.reps.length?'<p class="mu" style="margin:0 0 4px">반복 틀</p><div class="rw" style="flex-wrap:wrap">'+S.reps.map(r=>`<button class="ch" data-a="tpl" data-id="${r.id}">${esc(r.title)}</button>`).join('')+'</div>':''}<label class="mu" for="q-t">제목</label><input id="q-t" class="in" value="${esc(T.title)}"><label class="mu" for="q-d">자세히 쓰기</label><textarea id="q-d" class="in" rows="5" placeholder="이 일정에 대해 자유롭게 적어 보세요">${esc(T.detail)}</textarea>`:'')
+`<label class="mu" for="q-x">시간 (직접 쓰기)</label><input id="q-x" class="in" value="${T.time?fmtTime(T.time):''}" placeholder="예: 7:30, 오후 7시 30분"><div class="rw">${selHTML()}</div>`
+`<p class="mu" style="margin:4px 0 8px">${T.msg||'비워 두면 종일 일정이에요.'}</p><div class="rw"><button class="ch" data-a="fmt">${S.fmt12?'오전·오후 표기':'24시간 표기'}</button></div>`
+`<label class="mu" for="q-l">알람</label><select id="q-l" class="in"${T.time?'':' disabled'}>${ALARMS.map(([v,l])=>`<option value="${v===null?'':v}"${T.alarm===v?' selected':''}>${l}</option>`).join('')}</select>`
+`<p class="mu" style="margin:4px 0 8px">설정한 시간에 소리와 알림창으로 알려드려요.</p>`
+`<div class="rw">${T.id?'<button class="ch" style="color:var(--no)" data-a="del">삭제</button>':''}<button class="ch pr" data-a="ok">완료</button></div></div></div>`}
SH.addEventListener('change',e=>{if(!T)return;const i=e.target.id;
if(i==='q-x'){const v=e.target.value.trim();if(!v){T.time=null;T.msg=''}else{const p=parseTime(v);if(p){T.time=p;T.msg=''}else T.msg='시간을 이해하지 못했어요. 예: 7:30, 오후 7시 30분'}if(T.time===null)T.alarm=null;drawSheet()}
else if(i==='q-h'||i==='q-m'||i==='q-a'){const hv=$('q-h').value;if(hv===''){T.time=null;T.alarm=null}else{let h=+hv;if(S.fmt12)h=(h%12)+(+$('q-a').value?12:0);T.time=pad(h)+':'+pad(+$('q-m').value);T.msg=''}drawSheet()}
else if(i==='q-l')T.alarm=e.target.value===''?null:+e.target.value;
else if(i==='q-t')T.title=e.target.value;
else if(i==='q-d')T.detail=e.target.value});
SH.addEventListener('input',e=>{if(!T)return;if(e.target.id==='q-d')T.detail=e.target.value;if(e.target.id==='q-t')T.title=e.target.value});
SH.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;if(b.dataset.a==='ovx'){if(e.target===b)closeSheet();return}if(A[b.dataset.a])A[b.dataset.a](b.dataset)});
A.fmt=()=>{S.fmt12=!S.fmt12;save();drawSheet();render()};
A.ok=()=>{if(!T)return;
if(T.alarm!==null && "Notification" in window && Notification.permission==='default'){Notification.requestPermission()}
if(T.id){const o=S.items.find(x=>x.id===T.id);updItem(T.id,{title:T.title.trim()||o.title,detail:T.detail,time:T.time,alarm:T.alarm})}else if(T.full){const t=T.title.trim();if(!t){T.msg='제목을 적어 주세요.';drawSheet();return}addItem({date:sel,title:t,detail:T.detail,time:T.time,alarm:T.alarm});DR={title:'',time:null,alarm:null}}else{DR.time=T.time;DR.alarm=T.alarm}closeSheet();render()};
A.del=()=>{const id=T.id;closeSheet();removeWithUndo(id)};

/* month.js: 한 달 달력 */
let cm={y:new Date().getFullYear(),m:new Date().getMonth()};
const MOODS=['😀','🙂','😐','😟','😢'];
function setSel(k){sel=k;const s=dkey(k),t=new Date();s.setDate(s.getDate()-s.getDay());t.setHours(12,0,0,0);t.setDate(t.getDate()-t.getDay());wk=Math.round((s-t)/(7*DAY))}
function monthHTML(){const y=cm.y,m=cm.m,n=new Date(y,m+1,0).getDate(),f=new Date(y,m,1).getDay(),td=ymd(new Date());
const gd={};Object.values(S.goalsM).flat().forEach(g=>{if(g.done&&g.doneOn)gd[g.doneOn]=1});
let h=`<div class="mg" style="margin-top:12px">${[...WD].map((w,i)=>`<span class="mu${i===0?' hl':i===6?' bl':''}">${w}</span>`).join('')}</div><div class="mg">`+'<i></i>'.repeat(f);
for(let d=1;d<=n;d++){const k=ymd(new Date(y,m,d));h+=`<button class="mc${k===td?' mt':''}${isRed(k)?' mh':isSat(k)?' mb':''}${k===sel?' ms':''}" data-a="mp" data-d="${k}" aria-label="${k}">${gd[k]?'<span class="gf" aria-label="목표 달성">🚩</span>':''}<b>${d}</b><span class="dt">${dotsFor(k)}</span><span class="mo">${S.moods[k]||''}</span></button>`}
return h+'</div>'}
function dayPanelHTML(){const d=dkey(sel),hn=holiday(sel);return `<div class="mp"><div class="hd"><div><p class="mu${isRed(sel)?' hl':isSat(sel)?' bl':''}" style="margin:0">${WD[d.getDay()]}요일${hn?' · '+hn:''}</p><b style="font-size:18px;font-weight:500">${d.getMonth()+1}월 ${d.getDate()}일</b></div><span class="mu">${wxS(sel)}</span></div><div class="mr">${MOODS.map(e=>`<button class="mm${S.moods[sel]===e?' on':''}" data-a="mood" data-m="${e}" aria-label="기분 ${e}">${e}</button>`).join('')}</div>${goalDoneHTML()}${listHTML()}<button class="ch" style="margin:8px 0 16px" data-a="new">＋ 일정 추가</button></div>`}
function calHTML(){const t=new Date(),cur=cm.y===t.getFullYear()&&cm.m===t.getMonth();return `<div id="ls"><div class="hd" style="margin-top:16px"><div><p class="mu" style="margin:0">${cm.y}년</p><div class="rw" style="align-items:center;gap:10px;margin:0"><h1 style="margin:0">${cm.m+1}월</h1>${goalSumHTML()}</div></div><div>${cur?'':'<button class="tx" data-a="mtoday">오늘</button>'}<button class="nv" data-a="mm" data-n="-1" aria-label="지난달">‹</button><button class="nv" data-a="mm" data-n="1" aria-label="다음달">›</button></div></div>${monthHTML()}</div>`}
let DY=false,GS=false,GE=null;
const ymOf=()=>cm.y+'-'+pad(cm.m+1),mg=()=>S.goalsM[ymOf()]||[];
function migGoals(){if(S.goals&&S.goals.length){const ym=ymd(new Date()).slice(0,7),a=S.goalsM[ym]=S.goalsM[ym]||[];S.goals.forEach(t=>a.push({id:uid(),t,done:false}));S.goals=[];save()}}
function goalSumHTML(){const g=mg();return `<button class="gs" data-a="gtog" aria-label="이번 달 목표">${g.length?`<span class="gt">${g[0].done?'✓ ':''}${esc(g[0].t)}</span>${g.length>1?`<span>외 ${g.length-1}건</span>`:''}`:'<span>＋ 목표</span>'}</button>`}
function drawGoals(){GS=true;const g=mg(),n=g.filter(x=>x.done).length;SH.innerHTML=`<div class="ov" data-a="ovx"><div class="sh" role="dialog" aria-modal="true" aria-label="목표"><div class="hd"><div><p class="mu" style="margin:0">${cm.y}년</p><b style="font-size:18px;font-weight:500">${cm.m+1}월 목표</b></div><span class="mu">${g.length?n+'/'+g.length+' 달성':''}</span></div>${g.map(x=>x.id===GE?`<div class="r"><input id="ge" class="in" value="${esc(x.t)}" aria-label="목표 수정" style="margin:6px 0"><button class="ch on" data-a="gsave" data-id="${x.id}">저장</button><button class="ch" data-a="gcancel">취소</button></div>`:`<div class="r"><button class="ck${x.done?' dn':''}" role="checkbox" aria-checked="${!!x.done}" aria-label="달성 표시" data-a="gdone" data-id="${x.id}"></button><button class="rb" data-a="gedit" data-id="${x.id}"><span class="ti${x.done?' dd':''}">${esc(x.t)}</span></button><button class="rd" data-a="gedit" data-id="${x.id}">수정</button><button class="rd" data-a="gdel" data-id="${x.id}">삭제</button></div>`).join('')||'<p class="mu">이번 달 목표를 적어 보세요.</p>'}<div class="rw" style="margin:12px 0"><input id="gi" class="in" placeholder="목표 추가" aria-label="목표 입력" enterkeyhint="done"><button class="ch on" data-a="gadd">추가</button></div><button class="ch" data-a="dyc">닫기</button></div></div>`}
function goalDoneHTML(){const t=Object.values(S.goalsM).flat().filter(g=>g.done&&g.doneOn===sel).map(g=>esc(g.t));return t.length?`<p class="mu" style="margin:0 0 8px">🚩 달성한 목표 · ${t.join(', ')}</p>`:''}
A.gtog=()=>drawGoals();
A.gadd=()=>{const e=$('gi'),v=e?e.value.trim():'';if(!v)return;(S.goalsM[ymOf()]=mg()).push({id:uid(),t:v,done:false});save();drawGoals();render();$('gi').focus()};
A.gdone=d=>{const x=mg().find(y=>y.id===d.id);x.done=!x.done;x.doneOn=x.done?ymd(new Date()):null;save();drawGoals();render()};
A.gdel=d=>{const a=mg(),i=a.findIndex(y=>y.id===d.id),x=a[i];S.goalsM[ymOf()]=a.filter(y=>y.id!==d.id);save();drawGoals();render();toast('삭제했어요','되돌리기',()=>{const b=mg();b.splice(Math.min(i,b.length),0,x);S.goalsM[ymOf()]=b;save();drawGoals();render()})};
A.gedit=d=>{GE=d.id;drawGoals();const e=$('ge');e.focus();e.select()};
A.gsave=d=>{const v=$('ge').value.trim();if(!v){toast('내용을 적어 주세요');return}mg().find(y=>y.id===d.id).t=v;GE=null;save();drawGoals();render()};
A.gcancel=()=>{GE=null;drawGoals()};
document.addEventListener('keydown',e=>{if(e.target.id==='ge'&&e.key==='Enter'&&GE)A.gsave({id:GE})});
function drawDay(){DY=true;SH.innerHTML=`<div class="ov" data-a="ovx"><div class="sh" role="dialog" aria-modal="true" aria-label="선택한 날">${dayPanelHTML()}<button class="ch" style="margin:0 0 8px" data-a="dyc">닫기</button></div></div>`}
A.mp=d=>{setSel(d.d);DY=true;render()};
A.dyc=()=>closeSheet();
A.mm=d=>{const x=new Date(cm.y,cm.m+ +d.n,1),t=new Date();cm={y:x.getFullYear(),m:x.getMonth()};setSel(cm.y===t.getFullYear()&&cm.m===t.getMonth()?ymd(t):ymd(x));render()};
A.mtoday=()=>{const t=new Date();cm={y:t.getFullYear(),m:t.getMonth()};setSel(ymd(t));render()};
A.mood=d=>{if(S.moods[sel]===d.m)delete S.moods[sel];else S.moods[sel]=d.m;save();render()};
document.addEventListener('keydown',e=>{if(e.target.id==='gi'&&e.key==='Enter')A.gadd()});

/* weather.js: 선택한 날짜의 날씨 */
const WX={lat:36.274,lon:127.249,data:{},state:'idle'};
const WIC=c=>c===0?'☀️':c<=2?'🌤️':c===3?'☁️':c<=48?'🌫️':c<=57?'🌦️':c<=67?'🌧️':c<=77?'🌨️':c<=82?'🌧️':c<=86?'🌨️':'⛈️';
async function wxLoad(){if(WX.state!=='idle')return;WX.state='load';try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${WX.lat}&longitude=${WX.lon}&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Asia%2FSeoul&past_days=7&forecast_days=14`);const j=await r.json();j.daily.time.forEach((d,i)=>WX.data[d]={c:j.daily.weathercode[i],hi:Math.round(j.daily.temperature_2m_max[i]),lo:Math.round(j.daily.temperature_2m_min[i])});WX.state='ok'}catch(e){WX.state='fail'}if(!T&&!R)render()}
function wxS(k){const w=WX.data[k];return w?`${WIC(w.c)} ${w.hi}°/${w.lo}°`:WX.state==='fail'?'날씨 연동 예정':''}
const wxT=k=>wxS(k)?' · '+wxS(k):'';

/* repeat.js: 반복 일정 */
let R=null;
const rerr=m=>{R.msg=m;const e=$('r-m');if(e){e.textContent=m;e.style.color='var(--rd)';e.scrollIntoView({block:'center'})}toast(m)};
const rdays=r=>r.kind==='every'?r.every+'일마다':(r.days.length===7?'매일':r.days.map(i=>WD[i]).join('·'));
function repOn(r,k){if(k<r.start)return false;if(r.kind==='every')return Math.round((dkey(k)-dkey(r.start))/DAY)%r.every===0;return r.days.includes(dkey(k).getDay())}
let RPO=true;
function repListHTML(){const rs=S.reps.filter(r=>repOn(r,sel)).sort((a,b)=>(a.time||'').localeCompare(b.time||''));if(!rs.length)return '';
const rows=rs.map(r=>{const dn=!!S.rdone[sel+'|'+r.id];return `<div class="r"><button class="ck${dn?' dn':''}" role="checkbox" aria-checked="${dn}" aria-label="완료 표시" data-a="rtg" data-id="${r.id}"></button><button class="rb" data-a="redit" data-id="${r.id}"><span class="mu tm">${fmtTime(r.time)}</span><span class="ti${dn?' dd':''}">${esc(r.title)}</span><span class="mu">${r.detail?'메모 ':''}${r.alarm!==null&&r.alarm!==undefined?'⏰ ':''}${rdays(r)}</span></button></div>`}).join('');
return `<div class="rpn"><button class="rph" data-a="rptog" aria-expanded="${RPO}"><span>↻ 반복 일정 ${rs.length}</span><span class="mu">${RPO?'접기':'펼치기'}</span></button>${RPO?`<div class="rpl">${rows}</div>`:''}</div>`}
A.rptog=()=>{RPO=!RPO;render()};
function drawRep(){const L=R.mode==='list';SH.innerHTML=`<div class="ov" data-a="ovx"><div class="sh" role="dialog" aria-modal="true" aria-label="반복 일정">`+(L?
(S.reps.map(r=>`<div class="r"><button class="rb" data-a="redit" data-id="${r.id}"><span class="mu tm">${fmtTime(r.time)}</span><span class="ti">${esc(r.title)}</span><span class="mu">${r.detail?'메모 ':''}${r.alarm!==null&&r.alarm!==undefined?'⏰ ':''}${rdays(r)}</span></button><button class="rd" data-a="rdel" data-id="${r.id}">삭제</button></div>`).join('')||'<p class="mu">아직 반복 틀이 없어요.</p>')+`<p class="mu">반복 일정은 일정 화면 아래에 날짜별로 나와요. 틀을 누르면 수정해요.</p><div class="rw"><button class="ch on" data-a="rnew">＋ 새 반복</button></div>`
:`<label class="mu" for="r-t">내용</label><input id="r-t" class="in" value="${esc(R.title)}"><label class="mu" for="r-x">시간 (비우면 종일)</label><input id="r-x" class="in" value="${R.time?fmtTime(R.time):''}" placeholder="예: 7:30, 오후 7시 30분"><p class="mu" id="r-m" style="margin:0 0 8px">${R.msg||''}</p><label class="mu" for="r-l">알람</label><select id="r-l" class="in"${R.time?'':' disabled'}>${ALARMS.map(([v,l])=>`<option value="${v===null?'':v}"${R.alarm===v?' selected':''}>${l}</option>`).join('')}</select><p class="mu" style="margin:4px 0 8px">반복 일정 당일 설정한 시간에 소리와 알림창으로 알려드려요.</p><div class="rw"><button class="ch${R.kind==='wd'?' on':''}" data-a="rkind" data-v="wd">요일마다</button><button class="ch${R.kind==='every'?' on':''}" data-a="rkind" data-v="every">며칠마다</button></div>`
+(R.kind==='wd'?`<div class="rw" style="flex-wrap:wrap;margin-top:8px">${[0,1,2,3,4,5,6].map(i=>`<button class="ch${R.days.includes(i)?' on':''}" data-a="rday" data-d="${i}">${WD[i]}</button>`).join('')}</div>`:`<label class="mu" for="r-n">몇 일에 한 번</label><input id="r-n" class="in" type="number" min="1" max="365" value="${R.every}">`)
+`<label class="mu" for="r-s">시작일</label><input id="r-s" class="in" type="date" value="${R.start}"><label class="mu" for="r-d">자세히 (선택)</label><textarea id="r-d" class="in" rows="3">${esc(R.detail)}</textarea><div class="rw" style="margin-top:12px"><button class="ch" data-a="rback">목록</button><button class="ch on" style="margin-left:auto" data-a="rsave">저장</button></div>`)+`</div></div>`}
A.rp=()=>{R={mode:'list'};drawRep()};
A.rnew=()=>{R={mode:'edit',id:null,title:'',time:null,alarm:null,kind:'wd',days:[0,1,2,3,4,5,6],every:2,start:ymd(new Date()),detail:'',msg:''};drawRep()};
A.redit=d=>{const r=S.reps.find(x=>x.id===d.id);R={mode:'edit',id:r.id,title:r.title,time:r.time,alarm:r.alarm!==undefined?r.alarm:null,kind:r.kind||'wd',days:[...r.days||[]],every:r.every||2,start:r.start,detail:r.detail||'',msg:''};drawRep()};
A.rdel=d=>{S.reps=S.reps.filter(x=>x.id!==d.id);save();drawRep();render()};
A.rkind=d=>{R.kind=d.v;drawRep()};
A.rday=d=>{const i=+d.d,k=R.days.indexOf(i);k<0?R.days.push(i):R.days.splice(k,1);drawRep()};
A.rback=()=>{R={mode:'list'};drawRep()};
A.rtg=d=>{const k=sel+'|'+d.id;S.rdone[k]?delete S.rdone[k]:S.rdone[k]=1;save();render()};
A.rsave=()=>{const g=id=>{const e=$(id);return e?e.value:null};
const x=g('r-x');if(x!==null){const v=x.trim(),p=v?parseTime(v):null;if(!v)R.time=null;else if(p)R.time=p;else{rerr('시간을 이해하지 못했어요. 예: 7:30, 오후 7시 30분');return}}
const alEl=$('r-l');if(alEl)R.alarm=alEl.value===''?null:+alEl.value;if(!R.time)R.alarm=null;
if(g('r-n')!==null)R.every=Math.floor(+g('r-n'));if(g('r-s'))R.start=g('r-s');
const bad=!R.title.trim()?'내용을 적어 주세요.':R.kind==='wd'&&!R.days.length?'요일을 하나 이상 골라 주세요.':R.kind==='every'&&!(R.every>=1)?'1 이상의 숫자를 적어 주세요.':!R.start?'시작일을 골라 주세요.':'';
if(bad){rerr(bad);return}
if(R.alarm!==null&&"Notification" in window&&Notification.permission==='default'){Notification.requestPermission()}
const o={title:R.title.trim(),time:R.time,alarm:R.alarm,kind:R.kind,days:[...R.days].sort(),every:R.every,start:R.start,detail:R.detail};

/* alarm.js: 알람 소리(단일 인스턴스·실시간 음량 조절), 감시 루프 */
const ALARM_KEY='diary.alarms.fired';
function getFiredAlarms(){try{return JSON.parse(localStorage.getItem(ALARM_KEY))||{}}catch(e){return {}}}
function markAlarmFired(k){try{const f=getFiredAlarms();f[k]=Date.now();const old=Date.now()-7*864e5;for(const x in f){if(f[x]<old)delete f[x]}localStorage.setItem(ALARM_KEY,JSON.stringify(f))}catch(e){}}

/* 백그라운드 절전 방지 무음 오디오 (Keep-Alive) */
const SILENT_WAV='data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
let bgAudio=null, bgAudioPrimed=false;
function initBgAudio(){
  if(!bgAudio){
    bgAudio=new Audio(SILENT_WAV);
    bgAudio.loop=true;
    bgAudio.volume=0.01;
  }
}
function primeBgAudio(){
  if(bgAudioPrimed)return;
  initBgAudio();
  bgAudio.play().then(()=>{
    bgAudio.pause();
    bgAudioPrimed=true;
  }).catch(()=>{});
}
document.addEventListener('touchstart',primeBgAudio,{passive:true});
document.addEventListener('click',primeBgAudio,{passive:true});

function hasPendingAlarms(){
  const now=Date.now(), oneDayLater=now+24*3600*1000, fired=getFiredAlarms(), td=ymd(new Date());
  const hasItem=(S.items||[]).some(item=>{
    if(!item.time||item.alarm===null||item.done)return false;
    const itemDateTime=new Date(`${item.date}T${item.time}:00`).getTime();
    if(isNaN(itemDateTime))return false;
    const triggerTime=itemDateTime-(item.alarm*60*1000);
    return triggerTime>(now-60000)&&triggerTime<oneDayLater&&!fired[`${item.id}_${triggerTime}`];
  });
  if(hasItem)return true;

  const hasRep=(S.reps||[]).some(r=>{
    if(!r.time||r.alarm===null||r.alarm===undefined)return false;
    if(!repOn(r,td))return false;
    if(S.rdone&&S.rdone[td+'|'+r.id])return false;
    if(S.skip&&S.skip[td+'|'+r.id])return false;
    const repDateTime=new Date(`${td}T${r.time}:00`).getTime();
    if(isNaN(repDateTime))return false;
    const triggerTime=repDateTime-(r.alarm*60*1000);
    return triggerTime>(now-60000)&&triggerTime<oneDayLater&&!fired[`rep_${r.id}_${td}_${triggerTime}`];
  });
  return hasRep;
}

function updateBgKeepAlive(){
  const enabled=S.cfg.bgKeepAlive!==false;
  const pending=hasPendingAlarms();
  if(document.hidden&&enabled&&pending){
    initBgAudio();
    bgAudio.play().catch(()=>{});
  }else{
    if(bgAudio){try{bgAudio.pause()}catch(e){}}
  }
}

let activeAudioCtx=null, activeMasterGain=null, activeSourceNodes=[], curAudioNode=null, isPreviewPlaying=false;

function updatePreviewBtnUI(){
  const btn=document.querySelector('[data-a="testsnd"]');
  if(btn){
    btn.textContent=isPreviewPlaying?'⏹️ 재생 정지':'소리 미리듣기 🔔';
    if(isPreviewPlaying)btn.classList.add('on');else btn.classList.remove('on');
  }
}

function stopAlarmSound(){
  activeSourceNodes.forEach(src=>{try{src.stop()}catch(e){}});
  activeSourceNodes=[];
  if(curAudioNode){try{curAudioNode.stop()}catch(e){};curAudioNode=null}
  if(activeAudioCtx){try{activeAudioCtx.close()}catch(e){};activeAudioCtx=null;activeMasterGain=null}
  if(isPreviewPlaying){isPreviewPlaying=false;updatePreviewBtnUI()}
}

function updatePlayingVolume(rawVol){
  const v=Math.max(0,Math.min(100,rawVol!==undefined?rawVol:80))/100;
  if(activeMasterGain&&activeAudioCtx&&activeAudioCtx.state==='running'){
    activeMasterGain.gain.setValueAtTime(v,activeAudioCtx.currentTime);
  }
}

async function playAlarmSound(type, customVol, isPreview){
  stopAlarmSound(); // 이전 재생 중인 음원을 즉시 중지하여 소리 겹침 방지

  type=type||S.cfg.alarmSound||'chime';
  const rawVol=customVol!==undefined?customVol:(S.cfg.alarmVol!==undefined?S.cfg.alarmVol:80);
  const volScale=Math.max(0,Math.min(100,rawVol))/100;
  if(volScale<=0)return;

  try{
    const AudioCtx=window.AudioContext||window.webkitAudioContext;
    if(!AudioCtx)return;
    const ctx=new AudioCtx();
    activeAudioCtx=ctx;

    const masterGain=ctx.createGain();
    masterGain.gain.setValueAtTime(volScale,ctx.currentTime);
    masterGain.connect(ctx.destination);
    activeMasterGain=masterGain;

    if(isPreview){
      isPreviewPlaying=true;
      updatePreviewBtnUI();
    }

    // 1) 커스텀 음원 파일 재생
    if(type==='custom'){
      const custom=await idb('get','alarmSoundCustom');
      if(custom&&custom.buf){
        try{
          const audioBuffer=await ctx.decodeAudioData(custom.buf.slice(0));
          const src=ctx.createBufferSource();
          src.buffer=audioBuffer;
          src.connect(masterGain);
          src.onended=()=>{
            if(activeAudioCtx===ctx)stopAlarmSound();
          };
          src.start(0);
          curAudioNode=src;
          activeSourceNodes=[src];
          return;
        }catch(err){console.warn('커스텀 음원 디코딩 실패, 기본 사운드로 대체',err)}
      }
    }

    // 2) 내장 사운드 (Web Audio API)
    let totalDuration=0;
    if(type==='beep'){ // 디지털 시계 비프
      const beeps=[0, 0.15, 0.4, 0.55];
      totalDuration=0.65;
      beeps.forEach(st=>{
        const osc=ctx.createOscillator();
        const gain=ctx.createGain();
        osc.type='square';
        osc.frequency.setValueAtTime(1046.50,ctx.currentTime+st);
        gain.gain.setValueAtTime(0.18,ctx.currentTime+st);
        gain.gain.setValueAtTime(0,ctx.currentTime+st+0.08);
        osc.connect(gain);gain.connect(masterGain);
        osc.start(ctx.currentTime+st);osc.stop(ctx.currentTime+st+0.09);
        activeSourceNodes.push(osc);
      });
    }else if(type==='bell'){ // 부드러운 종소리
      totalDuration=1.9;
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.type='sine';
      osc.frequency.setValueAtTime(880,ctx.currentTime);
      gain.gain.setValueAtTime(0.35,ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+1.8);
      osc.connect(gain);gain.connect(masterGain);
      osc.start(ctx.currentTime);osc.stop(ctx.currentTime+1.85);
      activeSourceNodes.push(osc);
    }else if(type==='marimba'){ // 마림바 멜로디
      totalDuration=0.65;
      const seq=[{f:440,t:0},{f:554.37,t:0.12},{f:659.25,t:0.24},{f:880,t:0.36}];
      seq.forEach(n=>{
        const osc=ctx.createOscillator();
        const gain=ctx.createGain();
        osc.type='sine';
        osc.frequency.setValueAtTime(n.f,ctx.currentTime+n.t);
        gain.gain.setValueAtTime(0.3,ctx.currentTime+n.t);
        gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+n.t+0.25);
        osc.connect(gain);gain.connect(masterGain);
        osc.start(ctx.currentTime+n.t);osc.stop(ctx.currentTime+n.t+0.28);
        activeSourceNodes.push(osc);
      });
    }else{ // chime (기본: 맑은 차임)
      totalDuration=1.5;
      const notes=[
        {f:523.25,t:0.00,d:0.18},
        {f:659.25,t:0.15,d:0.18},
        {f:783.99,t:0.30,d:0.22},
        {f:1046.50,t:0.48,d:0.38},
        {f:783.99,t:0.85,d:0.18},
        {f:1046.50,t:1.00,d:0.45}
      ];
      notes.forEach(n=>{
        const osc=ctx.createOscillator();
        const gain=ctx.createGain();
        osc.type='triangle';
        osc.frequency.setValueAtTime(n.f,ctx.currentTime+n.t);
        gain.gain.setValueAtTime(0.25,ctx.currentTime+n.t);
        gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+n.t+n.d);
        osc.connect(gain);gain.connect(masterGain);
        osc.start(ctx.currentTime+n.t);osc.stop(ctx.currentTime+n.t+n.d+0.05);
        activeSourceNodes.push(osc);
      });
    }

    setTimeout(()=>{
      if(activeAudioCtx===ctx)stopAlarmSound();
    }, (totalDuration+0.1)*1000);

  }catch(e){console.warn('알람 소리 재생 실패:',e);stopAlarmSound()}
}

function checkAlarms(){
  const now=Date.now();
  const fired=getFiredAlarms();

  // 1) 일반 일정 알람
  S.items.forEach(item=>{
    if(!item.time || item.alarm===null || item.done) return;
    const itemDateTime=new Date(`${item.date}T${item.time}:00`).getTime();
    if(isNaN(itemDateTime)) return;

    const triggerTime=itemDateTime - (item.alarm * 60 * 1000);
    const key=`${item.id}_${triggerTime}`;

    if(now >= triggerTime && now < (triggerTime + 300000) && !fired[key]){
      markAlarmFired(key);
      triggerAlarm(item, false);
      updateBgKeepAlive();
    }
  });

  // 2) 반복 일정 알람
  const td=ymd(new Date());
  (S.reps||[]).forEach(r=>{
    if(!r.time || r.alarm===null || r.alarm===undefined) return;
    if(!repOn(r,td)) return;
    if(S.rdone && S.rdone[td+'|'+r.id]) return;
    if(S.skip && S.skip[td+'|'+r.id]) return;

    const repDateTime=new Date(`${td}T${r.time}:00`).getTime();
    if(isNaN(repDateTime)) return;

    const triggerTime=repDateTime - (r.alarm * 60 * 1000);
    const key=`rep_${r.id}_${td}_${triggerTime}`;

    if(now >= triggerTime && now < (triggerTime + 300000) && !fired[key]){
      markAlarmFired(key);
      triggerAlarm({date:td,title:r.title,time:r.time,alarm:r.alarm,detail:r.detail}, true);
      updateBgKeepAlive();
    }
  });
}

// 지원 브라우저(Chromium 등)의 시스템 알람 스케줄러(TimestampTrigger)에 미리 예약
async function syncScheduledNotifications(){
  if(!('serviceWorker' in navigator) || !window.SW_REG) return;
  if(!("Notification" in window) || Notification.permission !== 'granted') return;
  const hasTriggers = ('showTrigger' in Notification.prototype) && ('TimestampTrigger' in window);
  if(!hasTriggers) return;

  try {
    const existing = await window.SW_REG.getNotifications({ includeTriggered: false });
    const existingTags = new Set(existing.map(n => n.tag));
    const now = Date.now(), maxFuture = now + 48 * 3600 * 1000, fired = getFiredAlarms();

    (S.items||[]).forEach(item => {
      if(!item.time || item.alarm === null || item.done) return;
      const itemDateTime = new Date(`${item.date}T${item.time}:00`).getTime();
      if(isNaN(itemDateTime)) return;
      const triggerTime = itemDateTime - (item.alarm * 60 * 1000);
      const key = `trig_${item.id}_${triggerTime}`;

      if(triggerTime > now && triggerTime < maxFuture && !fired[`${item.id}_${triggerTime}`] && !existingTags.has(key)){
        const offsetStr = item.alarm === 0 ? '정시' : item.alarm + '분 전';
        window.SW_REG.showNotification(`[다이어리 알람] ${item.title}`, {
          body: `${item.date} ${fmtTime(item.time)} 일정 (${offsetStr})${item.detail ? ' · ' + item.detail : ''}`,
          icon: 'icon-192.png',
          badge: 'favicon.png',
          tag: key,
          showTrigger: new TimestampTrigger(triggerTime),
          vibrate: [500, 200, 500, 200, 500],
          requireInteraction: true,
          data: { url: './index.html' }
        }).catch(()=>{});
      }
    });

    [ymd(new Date()), ymd(new Date(now + 864e5))].forEach(td => {
      (S.reps || []).forEach(r => {
        if(!r.time || r.alarm === null || r.alarm === undefined) return;
        if(!repOn(r, td)) return;
        if(S.rdone && S.rdone[td + '|' + r.id]) return;
        if(S.skip && S.skip[td + '|' + r.id]) return;

        const repDateTime = new Date(`${td}T${r.time}:00`).getTime();
        if(isNaN(repDateTime)) return;
        const triggerTime = repDateTime - (r.alarm * 60 * 1000);
        const key = `trig_rep_${r.id}_${td}_${triggerTime}`;

        if(triggerTime > now && triggerTime < maxFuture && !fired[`rep_${r.id}_${td}_${triggerTime}`] && !existingTags.has(key)){
          const offsetStr = r.alarm === 0 ? '정시' : r.alarm + '분 전';
          window.SW_REG.showNotification(`[다이어리 반복 알람] ${r.title}`, {
            body: `${td} ${fmtTime(r.time)} 반복 일정 (${offsetStr})${r.detail ? ' · ' + r.detail : ''}`,
            icon: 'icon-192.png',
            badge: 'favicon.png',
            tag: key,
            showTrigger: new TimestampTrigger(triggerTime),
            vibrate: [500, 200, 500, 200, 500],
            requireInteraction: true,
            data: { url: './index.html' }
          }).catch(()=>{});
        }
      });
    });
  } catch(e) {
    console.warn('알람 스케줄링 예외:', e);
  }
}

  if(u)return `<div class="set-row"><div><div style="font-size:14px;font-weight:500">${esc(u.email||'')}</div><div class="mu" style="font-size:12px">Google / 이메일 연동됨</div></div><div class="rw" style="gap:6px"><button class="ch on" data-a="sysync">동기화</button><button class="ch" data-a="syout">로그아웃</button></div></div>`;

  return `<button class="ch on" data-a="sygoogle" style="width:100%;margin:4px 0 8px">Google로 간편 로그인</button>
  <button class="set-tog-btn" style="margin:4px 0" data-a="emailtog">${EMAIL_LOGIN_OPEN?'▲ 이메일 로그인 닫기':'▼ 이메일로 로그인 / 회원가입'}</button>
  ${EMAIL_LOGIN_OPEN ? `
    <div style="margin-top:8px">
      <input id="sy-e" class="in" type="email" placeholder="이메일 주소" autocomplete="email" aria-label="이메일">
      <input id="sy-p" class="in" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password" aria-label="비밀번호" style="margin-top:4px">
      <p class="mu" style="margin:4px 0 8px;font-size:12px">${esc(SY.msg||'')}</p>
      <div class="rw"><button class="ch on" style="flex:1" data-a="syin">로그인</button><button class="ch" style="flex:1" data-a="syup">회원가입</button></div>
    </div>
  ` : ''}`;
}
A.sygoogle=async()=>{const p=new firebase.auth.GoogleAuthProvider();try{await SY.auth.signInWithPopup(p)}catch(e){if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e.code)){SY.auth.signInWithRedirect(p);return}syErr(e)}};
const syMail=async f=>{const e=$('sy-e').value.trim(),p=$('sy-p').value;if(!e||!p){syErr({message:'이메일과 비밀번호를 적어 주세요.'});return}try{await SY.auth[f](e,p)}catch(x){syErr(x)}};
A.syin=()=>syMail('signInWithEmailAndPassword');
A.syup=()=>syMail('createUserWithEmailAndPassword');
A.syout=async()=>{await SY.auth.signOut()};
A.sysync=async()=>{await syPull();await syPush()};

// 모바일 화면 전환 쿨다운 (최소 60초 간격)
let lastVisSync=0;
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&SY.user&&(Date.now()-lastVisSync>60000)){
    lastVisSync=Date.now();
    syPull().then(syPush);
  }
});

/* app.js: 하단 메뉴, 화면 그리기 (스크롤 위치 자동 복원) */
const TABS=['일정','달력','기록','설정'],NEXT={'달력':'한 달 달력은 2단계에서 만들어요.','기록':'기록 화면은 3단계에서 만들어요.','설정':'설정 화면은 5단계에서 만들어요.'};let tab='일정';
const app=document.getElementById('app');
function toast(m,label,fn){const t=document.getElementById('toast');t.textContent=m;if(label){const b=document.createElement('button');b.textContent=label;b.className='tu';b.onclick=()=>{fn();t.className=''};t.appendChild(b)}t.className=label?'on act':'on';clearTimeout(toast.h);toast.h=setTimeout(()=>{t.className=''},label?5000:2200)}
function tabsHTML(){return `<nav class="tb" aria-label="메뉴">${TABS.map(t=>`<button class="${t===tab?'a':''}" data-a="tab" data-t="${t}">${t}</button>`).join('')}</nav>`}

function render(){
  // 리렌더링 전 스크롤 위치 기억
  const ls=document.getElementById('ls');
  const lsTop=ls?ls.scrollTop:0;
  const winTop=window.scrollY||document.documentElement.scrollTop;

  app.innerHTML=(tab==='일정'?headHTML()+weekHTML()+`<div id="ls">${itemsListHTML()}</div>${repListHTML()}`+barHTML():tab==='달력'?calHTML():tab==='기록'?recHTML():tab==='설정'?setHTML():`<div class="hd"><h1>${tab}</h1></div><p class="mu" style="margin-top:24px">${NEXT[tab]}</p><div id="ls"></div>`)+tabsHTML();
  if(tab==='달력'&&DY&&!T&&!R)drawDay();

  // 리렌더링 후 스크롤 위치 즉시 복원 (화면 튐 방지)
  requestAnimationFrame(()=>{
    const newLs=document.getElementById('ls');
    if(newLs&&lsTop)newLs.scrollTop=lsTop;
    if(winTop)window.scrollTo(0,winTop);
  });
}

app.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset)});
A.tab=d=>{
  DY=false;
  stopAlarmSound();
  if(tab==='기록'&&d.t!=='기록')U=false;
  if(tab==='설정'&&d.t!=='설정'){
    if(TEMP_CFG){TEMP_CFG=null;applyCfg()}
    TEMP_SND=null;
    TEMP_VOL=null;
  }
  tab=d.t;
  if(tab==='달력')cm={y:+sel.slice(0,4),m:+sel.slice(5,7)-1};
  render();
};

// 시작
load();migGoals();applyCfg();render();wxLoad();syInit();
setInterval(checkAlarms, 3000);
setTimeout(checkAlarms, 500);

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').then(reg=>{
      window.SW_REG=reg;
      syncScheduledNotifications();
    }).catch(e=>console.warn('SW 등록 실패:',e));
  });
  navigator.serviceWorker.addEventListener('message',e=>{
    if(e.data&&e.data.type==='ALARM_CLICKED'){
      checkAlarms();
    }
  });
}
window.addEventListener('focus', checkAlarms);
window.addEventListener('pageshow', checkAlarms);
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden){
    checkAlarms();
    syncScheduledNotifications();
    updateBgKeepAlive();
  }else{
    updateBgKeepAlive();
  }
});

</script></body></html>
