<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>나만의 일기장</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet"><style>
:root{--bg:#FAF8F4;--tx:#2B2A27;--mu:#6E695F;--ln:#ECE8E0;--bd:#E3DED4;--sf:#fff;--ok:#4F9A83;--no:#C2773F;--ac:#46688F;--rd:#C0392B;--rs:#FF9C8F;--bl:#2F6DB5;--bs:#9CC3F2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1F1E1B;--tx:#F0EDE6;--mu:#A8A398;--ln:#34322D;--bd:#3F3C36;--sf:#2A2824;--ok:#6FBFA5;--no:#E09A66;--ac:#8FB0D8;--rd:#FF8A80;--rs:#B3261E;--bl:#8FB8F0;--bs:#2F6DB5}}
:root[data-theme="dark"]{--bg:#1F1E1B;--tx:#F0EDE6;--mu:#A8A398;--ln:#34322D;--bd:#3F3C36;--sf:#2A2824;--ok:#6FBFA5;--no:#E09A66;--ac:#8FB0D8;--rd:#FF8A80;--rs:#B3261E;--bl:#8FB8F0;--bs:#2F6DB5}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:400 15px/1.5 'Noto Sans KR',system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;min-height:44px}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:24px 24px 0}
.mu{color:var(--mu);font-size:13px}

.hd{display:flex;justify-content:space-between;align-items:center}
.nv{width:44px;font-size:22px;color:var(--mu)}
.tx{color:var(--ac);padding:0 8px;font-size:13px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;margin:16px 0 8px}
.d{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:14px;min-height:64px}

.ib{display:flex;align-items:center;gap:2px;border:1px solid var(--bd);background:var(--sf);border-radius:28px;padding:6px 6px 6px 18px;min-height:56px;margin:8px 0 12px}

.sh{background:var(--sf);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px 24px calc(20px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.in{width:100%;min-height:44px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);padding:0 12px;margin:4px 0 8px}
.rw{display:flex;gap:8px}.rw .in{flex:1}

#toast.on{opacity:1}
textarea.in{padding:10px 12px;line-height:1.7;resize:vertical}
.d.h b{color:var(--rd)}.d.a.h b{color:var(--rs)}.mu.hl{color:var(--rd)}

.d.b b{color:var(--bl)}.d.a.b b{color:var(--bs)}.mu.bl{color:var(--bl)}
.gl{border:1px solid var(--bd);border-radius:16px;padding:12px 16px;margin:16px 0 0;background:var(--sf)}
.gr{display:flex;align-items:center;gap:8px;min-height:36px}.gr span{flex:1}.gr button{min-height:36px;color:var(--mu);font-size:13px;padding:0 8px}

.mc.mt b{color:var(--ac);font-weight:500}.mc.mh b{color:var(--rd)}.mc.mb b{color:var(--bl)}
.mc.ms{background:var(--tx)}.mc.ms b{color:var(--bg)}.mc.ms.mh b{color:var(--rs)}.mc.ms.mb b{color:var(--bs)}
.mp{margin-top:16px;border-top:1px solid var(--ln);padding-top:12px}
.mr{display:flex;gap:4px;margin:8px 0}.mm{font-size:22px;min-width:44px;border-radius:22px;opacity:.4}.mm.on{opacity:1;background:var(--ln)}
textarea{font:inherit}
.ch.on{background:var(--tx);color:var(--bg)}
.st{margin:20px 0 6px;font-weight:500}
.cp{border:1px solid var(--bd);border-radius:14px;padding:10px 14px;margin:6px 0;background:var(--sf)}
.cp label{display:flex;align-items:center;gap:8px}.cp .rg{flex:1}.cp .rn{width:76px;flex:none;margin:2px 0}
.sw{height:28px;border-radius:8px;border:1px solid var(--bd);margin:6px 0}
.rc{border-bottom:1px solid var(--ln);padding:10px 0}.rt{width:100%;margin:6px 0}
.ph{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.ph span{position:relative}.ph img{width:84px;height:84px;object-fit:cover;border-radius:10px}
.ph button{position:absolute;top:0;right:0;min-height:28px;width:28px;background:var(--tx);color:var(--bg);border-radius:50%;font-size:12px}
.lk{margin-top:32px}
.pal{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.pc{width:34px;height:34px;min-height:34px;border-radius:50%;border:1px solid var(--bd)}
.pk{width:48px;height:34px;min-height:34px;padding:0;border:0;background:none;vertical-align:middle}
.rpn{flex:none;margin:8px 0 4px;border:1px solid var(--bd);border-radius:14px;background:color-mix(in srgb,var(--ac) 7%,var(--sf));padding:0 10px}
.rph{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:40px;font-size:13px}
.rpl{max-height:26vh;overflow:auto;border-top:1px solid var(--ln)}
.rpn .r{border-bottom:0}
.sh .mp{border:0;margin:0;padding:0}
.mc{position:relative}.gf{position:absolute;top:2px;right:8px;font-size:10px}
.gs{display:flex;gap:4px;max-width:190px;font-size:13px;color:var(--mu);border:1px solid var(--bd);border-radius:16px;padding:0 12px;min-height:32px;align-items:center}.gs span{flex:none}.gs .gt{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style></head><body><div id="app"></div><div id="sheet"></div><div id="toast" role="status"></div><script>
/* data.js: 항목 저장 구조 ("날짜가 붙은 항목") */
const KEY='diary.v1',A={};
let S={items:[],fmt12:false,goals:[],goalsM:{},moods:{},reps:[],skip:{},rdone:{},diary:{},cfg:{lock:true}},DR={title:'',time:null,alarm:null};
function load(){try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('저장 공간이 부족해요')}}
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function itemsOn(d){return S.items.filter(i=>i.date===d).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'))}
function addItem(o){S.items.push(Object.assign({id:uid(),kind:'event',time:null,alarm:null,done:false,detail:''},o));save()}
function updItem(id,p){const i=S.items.find(x=>x.id===id);if(i){Object.assign(i,p);save()}}
function delItem(id){const i=S.items.find(x=>x.id===id);if(i&&i.rid)S.skip[i.date+'|'+i.rid]=1;S.items=S.items.filter(x=>x.id!==id);save()}

/* time.js: 시간 해석·표기, 알람 선택지 */
function parseTime(s){s=s.toLowerCase().replace(/\s+/g,'');const pm=/오후|pm|p\.m/.test(s),am=/오전|am|a\.m/.test(s);s=s.replace(/오전|오후|a\.m\.?|p\.m\.?|am|pm/g,'');let h,n=0,m;
if(m=s.match(/^(\d{1,2})시반$/)){h=+m[1];n=30}else if(m=s.match(/^(\d{1,2})(?:[:시.](\d{1,2})?)?분?$/)){h=+m[1];n=+(m[2]||0)}else if(m=s.match(/^(\d{1,2})(\d{2})$/)){h=+m[1];n=+m[2]}else return null;
if(pm&&h<12)h+=12;if(am&&h===12)h=0;return h>23||n>59?null:pad(h)+':'+pad(n)}
function fmtTime(t){if(!t)return '종일';if(!S.fmt12)return t;const h=+t.slice(0,2);return (h<12?'오전 ':'오후 ')+(h%12||12)+':'+t.slice(3)}
const ALARMS=[[null,'알람 없음'],[0,'정시'],[10,'10분 전'],[30,'30분 전']];

/* holidays.js: 한국 공휴일 = 양력 고정일 + 음력(설날·추석·부처님오신날) 계산 + 대체공휴일 규칙 + 임시공휴일 표 */
const HX={'2026-06-03':'지방선거'};/* 임시공휴일·선거일처럼 미리 계산할 수 없는 날: 확인된 것만 여기에 추가 */
const HC={},DAY=864e5;
const iso=t=>t.toISOString().slice(0,10);
const utc=(y,m,d)=>new Date(Date.UTC(y,m,d));
function lunar(t){const o={};new Intl.DateTimeFormat('en-u-ca-chinese',{timeZone:'UTC',month:'numeric',day:'numeric'}).formatToParts(new Date(t.getTime()+12*36e5)).forEach(x=>o[x.type]=x.value);return {m:parseInt(o.month),leap:/\D/.test(o.month),d:+o.day}}
function holidaysOf(y){if(HC[y])return HC[y];const M={},dup={},cand=[];
const add=(t,n)=>{const k=iso(t);if(M[k])dup[k]=1;M[k]=n};
[[0,1,'신정'],[2,1,'삼일절',1],[4,5,'어린이날',1],[5,6,'현충일'],[7,15,'광복절',1],[9,3,'개천절',1],[9,9,'한글날',1],[11,25,'성탄절',1]].concat(y>=2026?[[6,17,'제헌절',1]]:[],y>=2027?[[4,1,'노동절',1]]:[]).forEach(([m,d,n,s])=>{const t=utc(y,m,d);add(t,n);if(s)cand.push({e:t,n,s:1})});
for(let t=utc(y,0,1);t.getUTCFullYear()===y;t=new Date(t.getTime()+DAY)){const l=lunar(t);if(l.leap)continue;
if(l.m===4&&l.d===8){add(t,'부처님오신날');cand.push({e:t,n:'부처님오신날',s:1})}
else if((l.m===1&&l.d===1)||(l.m===8&&l.d===15)){const n=l.m===1?'설날':'추석',b=[-1,0,1].map(i=>new Date(t.getTime()+i*DAY));b.forEach((x,i)=>add(x,i===1?n:n+' 연휴'));cand.push({e:b[2],n,b})}}
Object.keys(HX).forEach(k=>{if(+k.slice(0,4)===y)M[k]=HX[k]});
const wk=t=>t.getUTCDay()%6===0,nx=t=>{t=new Date(t.getTime()+DAY);while(wk(t)||M[iso(t)])t=new Date(t.getTime()+DAY);return t},done={};
cand.sort((a,b)=>a.e-b.e).forEach(c=>{const k=iso(c.e);if(done[k])return;const hit=c.b?c.b.some(x=>x.getUTCDay()===0||dup[iso(x)]):(wk(c.e)||dup[k]);if(hit){done[k]=1;M[iso(nx(c.e))]='대체공휴일('+c.n+')'}});
return HC[y]=M}
function holiday(k){return holidaysOf(+k.slice(0,4))[k]||null}
function isRed(k){return new Date(k+'T12:00:00').getDay()===0||!!holiday(k)}
function isSat(k){return new Date(k+'T12:00:00').getDay()===6}

/* week.js: 1주일 달력 (월요일 시작) */
const WD='일월화수목금토';let sel=ymd(new Date()),wk=0;
const dkey=k=>new Date(k+'T12:00:00');
function shift(k,n){const d=dkey(k);d.setDate(d.getDate()+n);return ymd(d)}
function weekDays(){const t=new Date();t.setHours(12,0,0,0);t.setDate(t.getDate()-t.getDay()+7*wk);return [0,1,2,3,4,5,6].map(i=>{const d=new Date(t);d.setDate(t.getDate()+i);return ymd(d)})}
const star=c=>`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" style="stroke:${c}" stroke-width="2" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>`;
function dotsFor(k){const it=itemsOn(k);if(!it.length)return '';if(it.length>=5)return star(it.every(i=>i.done)?'var(--ok)':'var(--no)');return it.slice(0,4).map(i=>`<i class="${i.done?'y':'n'}"></i>`).join('')}
function headHTML(){const d=dkey(sel),home=sel===ymd(new Date())&&wk===0,hn=holiday(sel);return `<div class="hd"><div><p class="mu${isRed(sel)?' hl':isSat(sel)?' bl':''}" style="margin:0">${WD[d.getDay()]}요일${hn?' · '+hn:''}${wxT(sel)}</p><h1>${d.getMonth()+1}월 ${d.getDate()}일</h1></div><div>${home?'':'<button class="tx" data-a="today">오늘</button>'}<button class="nv" data-a="wk" data-n="-1" aria-label="지난주">‹</button><button class="nv" data-a="wk" data-n="1" aria-label="다음주">›</button></div></div>`}
function weekHTML(){const td=ymd(new Date());return `<div class="wk">${weekDays().map((k,i)=>`<button class="d${k===sel?' a':''}${k===td?' t':''}${isRed(k)?' h':!isRed(k)&&isSat(k)?' b':''}" data-a="pick" data-d="${k}" aria-label="${k}"><span class="mu${i===0?' hl':i===6?' bl':''}">${'일월화수목금토'[i]}</span><b>${+k.slice(8)}</b><span class="dt">${dotsFor(k)}</span></button>`).join('')}</div>`}
A.pick=d=>{sel=d.d;render()};
A.wk=d=>{wk+=+d.n;sel=shift(sel,7*+d.n);render()};
A.today=()=>{sel=ymd(new Date());wk=0;render()};

/* list.js: 선택한 날짜의 시간순 목록 */
function listHTML(){return itemsListHTML()+repListHTML()}
function itemsListHTML(){const it=itemsOn(sel);if(!it.length)return '<p class="mu" style="margin-top:24px">'+(tab==='일정'?'이 날은 비어 있어요. 아래에 적어 보세요.':'이 날은 비어 있어요.')+'</p>';
return it.map(i=>`<div class="r"><button class="ck${i.done?' dn':''}" role="checkbox" aria-checked="${i.done}" aria-label="완료 표시" data-a="done" data-id="${i.id}"></button><button class="rb" data-a="open" data-id="${i.id}"><span class="mu tm">${fmtTime(i.time)}</span><span class="ti${i.done?' dd':''}">${esc(i.title)}</span><span class="mu">${i.detail?'메모 ':''}${i.alarm!==null?'알림':''}</span></button><button class="rd" data-a="rm" data-id="${i.id}" aria-label="삭제">삭제</button></div>`).join('')}
A.done=d=>{const i=S.items.find(x=>x.id===d.id);updItem(d.id,{done:!i.done});render()};
A.open=d=>openSheet(d.id);
function removeWithUndo(id){const i=S.items.find(x=>x.id===id);if(!i)return;const k=S.items.indexOf(i);delItem(id);render();toast('삭제했어요','되돌리기',()=>{S.items.splice(Math.min(k,S.items.length),0,i);save();render()})}
A.rm=d=>removeWithUndo(d.id);

/* input.js: 하단 입력줄 (제목, 시간, 반복 자리, 추가) */
function barHTML(){return `<div class="ib"><input id="ti" placeholder="일정을 적어요" value="${esc(DR.title)}" aria-label="일정 입력" enterkeyhint="done"><button class="cb" data-a="dt">${DR.time?fmtTime(DR.time):'시간'}</button><button class="cb" data-a="rp">반복</button><button class="ad" data-a="new" aria-label="자세히 쓰기로 추가">+</button></div>`}
A.dt=()=>openSheet(null,'time');A.new=()=>openSheet(null,'new');

A.add=()=>{const t=DR.title.trim();if(!t){const e=document.getElementById('ti');if(e)e.focus();return}addItem({date:sel,title:t,time:DR.time,alarm:DR.alarm});DR={title:'',time:null,alarm:null};render()};
document.addEventListener('input',e=>{if(e.target.id==='ti')DR.title=e.target.value});
document.addEventListener('keydown',e=>{if(e.target.id==='ti'&&e.key==='Enter')A.add()});

/* sheet.js: 시간·알람 설정 시트 (새 일정 입력과 기존 일정 수정에 같이 사용) */
let T=null;const SH=document.getElementById('sheet'),$=id=>document.getElementById(id);
function openSheet(id,mode){const i=id&&S.items.find(x=>x.id===id);T={id:id||null,full:!!(i||mode==='new'),title:i?i.title:(mode==='new'?DR.title:''),detail:i?(i.detail||''):'',time:i?i.time:DR.time,alarm:i?i.alarm:DR.alarm,msg:''};drawSheet()}
function closeSheet(){const back=DY&&(T||R);T=null;R=null;SH.innerHTML='';if(back)drawDay();else{DY=false;GS=false;GE=null}}
function selHTML(){const t=T.time,h=t?+t.slice(0,2):'',m=t?+t.slice(3):0;
const mo=[...Array(12).keys()].map(k=>k*5);if(t&&!mo.includes(m)){mo.push(m);mo.sort((a,b)=>a-b)}
const mm=`<select id="q-m" class="in" aria-label="분">${mo.map(x=>`<option value="${x}"${x===m?' selected':''}>${pad(x)}분</option>`).join('')}</select>`;
if(S.fmt12){const pm=h!==''&&h>=12;return `<select id="q-a" class="in" aria-label="오전 오후"><option value="0"${pm?'':' selected'}>오전</option><option value="1"${pm?' selected':''}>오후</option></select><select id="q-h" class="in" aria-label="시"><option value="">시</option>${[...Array(12).keys()].map(k=>{const v=k+1;return `<option value="${v}"${h!==''&&(h%12||12)===v?' selected':''}>${v}시</option>`}).join('')}</select>${mm}`}
return `<select id="q-h" class="in" aria-label="시"><option value="">시</option>${[...Array(24).keys()].map(k=>`<option value="${k}"${h===k?' selected':''}>${k}시</option>`).join('')}</select>${mm}`}
function drawSheet(){SH.innerHTML=`<div class="ov" data-a="ovx"><div class="sh" role="dialog" aria-modal="true" aria-label="시간과 알람">`

/* weather.js: 선택한 날짜의 날씨(Open-Meteo, 무료·키 없음, 계룡시 기준). 외부 접속이 막힌 환경(미리보기)에서는 '연동 예정'으로 표시 */
const WX={lat:36.274,lon:127.249,data:{},state:'idle'};
const WIC=c=>c===0?'☀️':c<=2?'🌤️':c===3?'☁️':c<=48?'🌫️':c<=57?'🌦️':c<=67?'🌧️':c<=77?'🌨️':c<=82?'🌧️':c<=86?'🌨️':'⛈️';
async function wxLoad(){if(WX.state!=='idle')return;WX.state='load';try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${WX.lat}&longitude=${WX.lon}&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Asia%2FSeoul&past_days=7&forecast_days=14`);const j=await r.json();j.daily.time.forEach((d,i)=>WX.data[d]={c:j.daily.weathercode[i],hi:Math.round(j.daily.temperature_2m_max[i]),lo:Math.round(j.daily.temperature_2m_min[i])});WX.state='ok'}catch(e){WX.state='fail'}if(!T&&!R)render()}
function wxS(k){const w=WX.data[k];return w?`${WIC(w.c)} ${w.hi}°/${w.lo}°`:WX.state==='fail'?'날씨 연동 예정':''}
const wxT=k=>wxS(k)?' · '+wxS(k):'';


/* repeat.js: 반복 틀(내용·시간·요일마다/며칠마다·시작일) 저장·수정·삭제, 일정 화면 아래 '반복 일정' 표시 */
let R=null;
const rerr=m=>{R.msg=m;const e=$('r-m');if(e){e.textContent=m;e.style.color='var(--rd)';e.scrollIntoView({block:'center'})}toast(m)};
const rdays=r=>r.kind==='every'?r.every+'일마다':(r.days.length===7?'매일':r.days.map(i=>WD[i]).join('·'));
function repOn(r,k){if(k<r.start)return false;if(r.kind==='every')return Math.round((dkey(k)-dkey(r.start))/DAY)%r.every===0;return r.days.includes(dkey(k).getDay())}
let RPO=true;
function repListHTML(){const rs=S.reps.filter(r=>repOn(r,sel)).sort((a,b)=>(a.time||'').localeCompare(b.time||''));if(!rs.length)return '';
const rows=rs.map(r=>{const dn=!!S.rdone[sel+'|'+r.id];return `<div class="r"><button class="ck${dn?' dn':''}" role="checkbox" aria-checked="${dn}" aria-label="완료 표시" data-a="rtg" data-id="${r.id}"></button><button class="rb" data-a="redit" data-id="${r.id}"><span class="mu tm">${fmtTime(r.time)}</span><span class="ti${dn?' dd':''}">${esc(r.title)}</span><span class="mu">${rdays(r)}</span></button></div>`}).join('');
return `<div class="rpn"><button class="rph" data-a="rptog" aria-expanded="${RPO}"><span>↻ 반복 일정 ${rs.length}</span><span class="mu">${RPO?'접기':'펼치기'}</span></button>${RPO?`<div class="rpl">${rows}</div>`:''}</div>`}

(S.reps.map(r=>`<div class="r"><button class="rb" data-a="redit" data-id="${r.id}"><span class="mu tm">${fmtTime(r.time)}</span><span class="ti">${esc(r.title)}</span><span class="mu">${rdays(r)}</span></button><button class="rd" data-a="rdel" data-id="${r.id}">삭제</button></div>`).join('')||'<p class="mu">아직 반복 틀이 없어요.</p>')+`<p class="mu">반복 일정은 일정 화면 아래에 날짜별로 나와요. 틀을 누르면 수정해요.</p><div class="rw"><button class="ch on" data-a="rnew">＋ 새 반복</button></div>`
:`<label class="mu" for="r-t">내용</label><input id="r-t" class="in" value="${esc(R.title)}"><label class="mu" for="r-x">시간 (비우면 종일)</label><input id="r-x" class="in" value="${R.time?fmtTime(R.time):''}" placeholder="예: 7:30, 오후 7시 30분"><p class="mu" id="r-m" style="margin:0 0 8px">${R.msg||''}</p><div class="rw"><button class="ch${R.kind==='wd'?' on':''}" data-a="rkind" data-v="wd">요일마다</button><button class="ch${R.kind==='every'?' on':''}" data-a="rkind" data-v="every">며칠마다</button></div>`
+(R.kind==='wd'?`<div class="rw" style="flex-wrap:wrap;margin-top:8px">${[0,1,2,3,4,5,6].map(i=>`<button class="ch${R.days.includes(i)?' on':''}" data-a="rday" data-d="${i}">${WD[i]}</button>`).join('')}</div>`:`<label class="mu" for="r-n">몇 일에 한 번</label><input id="r-n" class="in" type="number" min="1" max="365" value="${R.every}">`)
+`<label class="mu" for="r-s">시작일</label><input id="r-s" class="in" type="date" value="${R.start}"><label class="mu" for="r-d">자세히 (선택)</label><textarea id="r-d" class="in" rows="3">${esc(R.detail)}</textarea><div class="rw" style="margin-top:12px"><button class="ch" data-a="rback">목록</button><button class="ch on" style="margin-left:auto" data-a="rsave">저장</button></div>`)+`</div></div>`}

A.redit=d=>{const r=S.reps.find(x=>x.id===d.id);R={mode:'edit',id:r.id,title:r.title,time:r.time,kind:r.kind||'wd',days:[...r.days||[]],every:r.every||2,start:r.start,detail:r.detail||'',msg:''};drawRep()};

const x=g('r-x');if(x!==null){const v=x.trim(),p=v?parseTime(v):null;if(!v)R.time=null;else if(p)R.time=p;else{rerr('시간을 이해하지 못했어요. 예: 7:30, 오후 7시 30분');return}}
if(g('r-n')!==null)R.every=Math.floor(+g('r-n'));if(g('r-s'))R.start=g('r-s');
const bad=!R.title.trim()?'내용을 적어 주세요.':R.kind==='wd'&&!R.days.length?'요일을 하나 이상 골라 주세요.':R.kind==='every'&&!(R.every>=1)?'1 이상의 숫자를 적어 주세요.':!R.start?'시작일을 골라 주세요.':'';

/* record.js: 기록 탭 - 잠금(비밀번호), 일정(제목만, 누르면 자세히), 일기(제목·본문·사진) */
let U=false,OPEN=new Set();
const hash=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('dg'+s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
function lockHTML(){const has=!!S.cfg.pw;return `<div class="hd"><h1>기록</h1></div><div class="lk"><p class="mu">${has?'비밀번호를 입력하면 열려요.':'처음이에요. 비밀번호를 정해 주세요. 일기는 기본적으로 잠겨요.'}</p><input id="pw" class="in" type="password" placeholder="비밀번호" autocomplete="off" aria-label="비밀번호">${has?'':'<input id="pw2" class="in" type="password" placeholder="한 번 더" autocomplete="off" aria-label="비밀번호 확인">'}<p class="mu" id="pwm" style="margin:0 0 8px"></p><button class="ch on" data-a="unlock">${has?'열기':'정하고 열기'}</button></div><div id="ls"></div>`}
const phHTML=a=>a&&a.length?`<div class="ph">${a.map((s,n)=>`<span><img src="${s}" alt="첨부 사진"><button data-a="phd" data-n="${n}" aria-label="사진 삭제">✕</button></span>`).join('')}</div>`:'';
function recHTML(){if(S.cfg.lock&&!U)return lockHTML();
const d=dkey(sel),hn=holiday(sel),it=itemsOn(sel),dy=S.diary[sel]||{};
return `<div class="hd"><div><p class="mu${isRed(sel)?' hl':isSat(sel)?' bl':''}" style="margin:0">${WD[d.getDay()]}요일${hn?' · '+hn:''}${wxT(sel)}</p><h1>${d.getMonth()+1}월 ${d.getDate()}일</h1></div><div><button class="nv" data-a="rd" data-n="-1" aria-label="전날">‹</button><button class="nv" data-a="rd" data-n="1" aria-label="다음날">›</button></div></div><div id="ls">`
+it.map(i=>{const o=OPEN.has(i.id);return `<div class="rc"><div class="r" style="border:0"><button class="ck${i.done?' dn':''}" role="checkbox" aria-checked="${i.done}" aria-label="완료 표시" data-a="done" data-id="${i.id}"></button><button class="rb" data-a="ropen" data-id="${i.id}" aria-expanded="${o}"><span class="mu tm">${fmtTime(i.time)}</span><span class="ti${i.done?' dd':''}">${esc(i.title)}</span><span class="mu">${o?'접기':'자세히'}</span></button></div>${o?`<textarea class="in rt" data-id="${i.id}" rows="4" placeholder="이 일정에 대해 자세히 적어요" aria-label="자세히">${esc(i.detail||'')}</textarea><button class="rd" data-a="rm" data-id="${i.id}">일정 삭제</button>`:''}</div>`}).join('')
+`<div class="rc"><p class="mu" style="margin:0 0 4px">이 날의 일기</p><input class="in" data-dt="1" placeholder="제목" value="${esc(dy.title||'')}" aria-label="일기 제목"><textarea class="in rt" data-day="1" rows="7" placeholder="자유롭게 적어요" aria-label="일기">${esc(dy.text||'')}</textarea>${phHTML(dy.photos)}<button class="ch" data-a="pho">사진 추가</button></div><button class="ch" style="margin:12px 0" data-a="relock">지금 잠그기</button></div>`}
A.unlock=async()=>{const p=$('pw').value,m=$('pwm');if(S.cfg.pw){if(await hash(p)===S.cfg.pw){U=true;render()}else m.textContent='비밀번호가 달라요.'}else{if(p.length<4){m.textContent='4자 이상으로 정해 주세요.';return}if(p!==$('pw2').value){m.textContent='두 번 입력한 게 달라요.';return}S.cfg.pw=await hash(p);save();U=true;render()}};
A.relock=()=>{U=false;render()};
A.rd=d=>{setSel(shift(sel,+d.n));render()};
const dayRec=()=>S.diary[sel]||(S.diary[sel]={text:'',photos:[]});
const phArr=()=>{const y=dayRec();return y.photos||(y.photos=[])};
A.ropen=d=>{OPEN.has(d.id)?OPEN.delete(d.id):OPEN.add(d.id);render()};
const shrink=f=>new Promise(ok=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.65))};im.src=r.result};r.readAsDataURL(f)});
const FI=document.createElement('input');FI.type='file';FI.accept='image/*';FI.hidden=true;document.body.appendChild(FI);
FI.onchange=async()=>{const f=FI.files[0];FI.value='';if(!f)return;phArr().push(await shrink(f));save();render()};
A.pho=()=>FI.click();
A.phd=d=>{phArr().splice(+d.n,1);save();render()};
document.addEventListener('keydown',e=>{if(e.target.id==='pw'&&e.key==='Enter'&&S.cfg.pw)A.unlock()});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.dt){dayRec().title=t.value;save();return}if(!t.classList.contains('rt'))return;if(t.dataset.day){dayRec().text=t.value;save()}else updItem(t.dataset.id,{detail:t.value})});


/* settings.js: 설정 탭 - 이름, 배경/글자색(RGB 팔레트), 그라데이션, 글자 크기, 글꼴 파일, 시간 표기, 잠금 */
const D0=[250,248,244],DEF={bg:D0,bg2:[236,232,224],tx:[43,42,39]};
const PAL=['#ffffff','#faf8f4','#f1ece3','#e8e4dc','#cfcac0','#8a857c','#4a4640','#2b2a27','#111111','#fde2e4','#fad2e1','#e2ece9','#bee1e6','#dfe7fd','#cddafd','#fff1e6','#fdf2b3','#e9f5db','#cfe1b9','#b7d3a8','#9fc5a0','#f4a6a6','#e57373','#d9534f','#f6b26b','#e0944a','#f1c232','#76a5af','#6fa8dc','#4a7bd0','#8e7cc3','#c27ba0'];
const rgbOf=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
function setColor(k,c,box){S.cfg[k]=c;save();applyCfg();box=box||document.querySelector(`.cp[data-k="${k}"]`);box.querySelectorAll('[data-i]').forEach(x=>{if(x!==document.activeElement)x.value=c[+x.dataset.i]});box.querySelector('.sw').style.background='rgb('+c+')';box.querySelector('.hx').textContent=hex(c);const pk=box.querySelector('.pk');if(pk)pk.value=hex(c)}
const hex=c=>'#'+c.map(n=>pad(n.toString(16))).join('');
const idb=(m,k,v)=>new Promise(ok=>{try{const q=indexedDB.open('diary-fs',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>{const s=q.result.transaction('f',m==='get'?'readonly':'readwrite').objectStore('f'),r=m==='get'?s.get(k):s.put(v,k);r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)};q.onerror=()=>ok(null)}catch(e){ok(null)}});
async function useFont(buf){try{const f=new FontFace('UserFont',buf);await f.load();document.fonts.add(f);document.body.style.fontFamily="'UserFont','Noto Sans KR',system-ui,sans-serif"}catch(e){toast('글꼴을 읽지 못했어요')}}
function applyCfg(){const c=S.cfg,r=document.documentElement.style,g=a=>a?'rgb('+a+')':'';r.setProperty('--bg',g(c.bg));r.setProperty('--tx',g(c.tx));
document.body.style.background=c.grad&&c.bg2?`linear-gradient(160deg,${g(c.bg||D0)},${g(c.bg2)}) fixed`:'';document.getElementById('app').style.zoom=(c.fs||15)/15}
function rgbRow(k,label){const c=S.cfg[k]||DEF[k];return `<div class="cp" data-k="${k}"><p class="mu" style="margin:0">${label}</p><div class="sw" style="background:rgb(${c})"></div>${['R','G','B'].map((n,i)=>`<label class="mu">${n}<input type="range" class="rg" min="0" max="255" value="${c[i]}" data-k="${k}" data-i="${i}" aria-label="${label} ${n}"><input type="number" class="in rn" min="0" max="255" value="${c[i]}" data-k="${k}" data-i="${i}" aria-label="${label} ${n} 숫자"></label>`).join('')}<div class="pal">${PAL.map(h=>`<button class="pc" style="background:${h}" data-a="pcol" data-k="${k}" data-h="${h}" aria-label="색 ${h}"></button>`).join('')}</div><label class="mu">직접 고르기 <input type="color" class="pk" data-k="${k}" value="${hex(c)}" aria-label="${label} 색 선택"></label><p class="mu hx" style="margin:0">${S.cfg[k]?hex(c):'기본색 (움직이면 바뀌어요)'}</p></div>`}
function setHTML(){const c=S.cfg,has=!!c.pw;return `<div class="hd"><h1>설정</h1></div><div id="ls"><p class="mu st">기본 정보</p><input id="sn" class="in" placeholder="이름 (선택)" value="${esc(c.name||'')}" aria-label="이름">
<p class="mu st">화면</p><p class="mu" style="margin:0">화면 비율은 기기에 맞게 자동으로 맞춰져요.</p>${rgbRow('bg','배경색')}<div class="rw" style="margin:8px 0"><button class="ch${c.grad?' on':''}" data-a="grad">그라데이션 ${c.grad?'켜짐':'꺼짐'}</button><button class="ch" data-a="cfgreset">색·크기 기본값</button></div>${c.grad?rgbRow('bg2','그라데이션 끝색'):''}${rgbRow('tx','글자색')}
<p class="mu st">글자 크기 <span id="fsv">${c.fs||15}px</span></p><input id="fs" type="range" min="12" max="22" value="${c.fs||15}" style="width:100%" aria-label="글자 크기">
<p class="mu st">글꼴</p><p class="mu" style="margin:0 0 6px">${esc(c.fontName||'기본 글꼴')}</p><div class="rw"><button class="ch" data-a="fontp">글꼴 파일 첨부</button><button class="ch" data-a="fontx">기본으로</button></div><p class="mu">ttf, otf, woff 파일을 쓸 수 있어요.</p>
<p class="mu st">시간 표기</p><button class="ch on" data-a="fmt2">${S.fmt12?'오전·오후 표기':'24시간 표기'} (누르면 바뀌어요)</button>
<p class="mu st">잠금</p><button class="ch${c.lock?' on':''}" data-a="lockt">일기 잠금 ${c.lock?'켜짐':'꺼짐'}</button><input id="sp0" class="in" type="password" placeholder="현재 비밀번호"${has?'':' hidden'} aria-label="현재 비밀번호" style="margin-top:8px"><input id="sp1" class="in" type="password" placeholder="새 비밀번호 (4자 이상)" aria-label="새 비밀번호"><button class="ch" data-a="chpw">비밀번호 ${has?'바꾸기':'정하기'}</button>
<p class="mu st">준비 중</p><p class="mu" style="margin-bottom:24px">날씨는 외부 접속이 되는 곳(직접 올린 주소·앱)에서 자동으로 나와요. 기기 간 동기화, 위젯, AI 연동은 서버에 올리는 단계에서 붙여요.</p></div>`}
A.pcol=d=>setColor(d.k,rgbOf(d.h));
A.grad=()=>{S.cfg.grad=!S.cfg.grad;if(!S.cfg.bg2)S.cfg.bg2=[...DEF.bg2];save();applyCfg();render()};
A.cfgreset=()=>{['bg','bg2','tx'].forEach(k=>delete S.cfg[k]);S.cfg.grad=false;S.cfg.fs=15;save();applyCfg();render()};
A.fmt2=()=>{S.fmt12=!S.fmt12;save();render()};
A.lockt=async()=>{if(S.cfg.lock&&S.cfg.pw&&await hash($('sp0').value)!==S.cfg.pw){toast('아래 현재 비밀번호 칸에 적고 눌러 주세요');return}S.cfg.lock=!S.cfg.lock;save();render()};
A.chpw=async()=>{const n=$('sp1').value;if(S.cfg.pw&&await hash($('sp0').value)!==S.cfg.pw){toast('현재 비밀번호가 달라요');return}if(n.length<4){toast('새 비밀번호는 4자 이상이에요');return}S.cfg.pw=await hash(n);save();render();toast('비밀번호를 저장했어요')};
const FF=document.createElement('input');FF.type='file';FF.accept='.ttf,.otf,.woff,.woff2';FF.hidden=true;document.body.appendChild(FF);
FF.onchange=async()=>{const f=FF.files[0];FF.value='';if(!f)return;const b=await f.arrayBuffer();await idb('put','font',b);S.cfg.fontName=f.name;save();await useFont(b);render()};
A.fontp=()=>FF.click();
A.fontx=async()=>{await idb('put','font',null);S.cfg.fontName='';save();document.body.style.fontFamily='';render()};
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.k;
if(k&&(t.classList.contains('rg')||t.classList.contains('rn'))){const i=+t.dataset.i,v=Math.max(0,Math.min(255,Math.round(+t.value||0))),c=[...(S.cfg[k]||DEF[k])];c[i]=v;setColor(k,c,t.closest('.cp'))}
else if(k&&t.classList.contains('pk'))setColor(k,rgbOf(t.value),t.closest('.cp'))
else if(t.id==='fs'){S.cfg.fs=+t.value;save();applyCfg();$('fsv').textContent=t.value+'px'}
else if(t.id==='sn'){S.cfg.name=t.value;save()}});
idb('get','font').then(b=>{if(b)useFont(b)});


/* app.js: 하단 메뉴, 화면 그리기, 시작 */
const TABS=['일정','달력','기록','설정'],NEXT={'달력':'한 달 달력은 2단계에서 만들어요.','기록':'기록 화면은 3단계에서 만들어요.','설정':'설정 화면은 5단계에서 만들어요.'};let tab='일정';
const app=document.getElementById('app');
function toast(m,label,fn){const t=document.getElementById('toast');t.textContent=m;if(label){const b=document.createElement('button');b.textContent=label;b.className='tu';b.onclick=()=>{fn();t.className=''};t.appendChild(b)}t.className=label?'on act':'on';clearTimeout(toast.h);toast.h=setTimeout(()=>{t.className=''},label?5000:2200)}
function tabsHTML(){return `<nav class="tb" aria-label="메뉴">${TABS.map(t=>`<button class="${t===tab?'a':''}" data-a="tab" data-t="${t}">${t}</button>`).join('')}</nav>`}
function render(){app.innerHTML=(tab==='일정'?headHTML()+weekHTML()+`<div id="ls">${itemsListHTML()}</div>${repListHTML()}`+barHTML():tab==='달력'?calHTML():tab==='기록'?recHTML():tab==='설정'?setHTML():`<div class="hd"><h1>${tab}</h1></div><p class="mu" style="margin-top:24px">${NEXT[tab]}</p><div id="ls"></div>`)+tabsHTML();if(tab==='달력'&&DY&&!T&&!R)drawDay()}
app.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset)});
A.tab=d=>{DY=false;if(tab==='기록'&&d.t!=='기록')U=false;tab=d.t;if(tab==='달력')cm={y:+sel.slice(0,4),m:+sel.slice(5,7)-1};render()};
load();migGoals();applyCfg();render();wxLoad();

</script></body></html>
